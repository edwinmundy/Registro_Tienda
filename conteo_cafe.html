<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteo de Café - Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .coffee-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .coffee-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .coffee-toolbar h2 {
            color: var(--text);
            font-size: 1.45rem;
        }

        .toolbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .coffee-table,
        .registro-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
        }

        .coffee-table th,
        .coffee-table td,
        .registro-table th,
        .registro-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: middle;
        }

        .coffee-table thead th,
        .registro-table thead th {
            background: var(--muted-control-bg);
            color: var(--text);
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .coffee-table tbody:last-child tr:last-child td,
        .registro-table tbody tr:last-child td {
            border-bottom: none;
        }

        .ounce-cell {
            min-width: 86px;
            width: 86px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            background: var(--primary-soft);
            border-right: 3px solid var(--primary);
        }

        .group-6 .ounce-cell {
            color: var(--success-text);
            background: var(--success-soft);
            border-right-color: var(--success);
        }

        .group-9 .ounce-cell {
            color: var(--warning-text);
            background: var(--warning-soft);
            border-right-color: var(--warning);
        }

        .group-14 .ounce-cell {
            color: var(--primary);
            background: var(--primary-soft);
            border-right-color: var(--primary);
        }

        .group-start td {
            border-top: 3px solid var(--border);
        }

        .coffee-name {
            min-width: 210px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .qty-control {
            display: inline-grid;
            grid-template-columns: 38px minmax(70px, 92px) 38px;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--muted-control-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 800;
            line-height: 1;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .qty-btn:hover {
            background: var(--primary-soft);
            transform: translateY(-1px);
        }

        .qty-btn.minus:hover {
            background: var(--danger-soft);
            color: var(--danger-text);
        }

        .qty-input {
            width: 100%;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
        }

        .row-register {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            background: var(--success);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .row-register:hover,
        .btn-primary:hover,
        .btn-secondary:hover {
            box-shadow: var(--shadow);
        }

        .registro-empty {
            text-align: center;
            color: var(--text-light);
            padding: 22px;
            font-weight: 600;
        }

        .registro-total {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--success-soft);
            color: var(--success-text);
            font-weight: 800;
        }

        @media (max-width: 720px) {
            .coffee-panel {
                padding: 16px;
            }

            .coffee-table th,
            .coffee-table td,
            .registro-table th,
            .registro-table td {
                padding: 10px;
            }

            .qty-control {
                grid-template-columns: 34px 64px 34px;
                gap: 6px;
            }

            .qty-btn,
            .qty-input {
                height: 34px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                <h1>☕ Conteo de Café</h1>
                <div id="user-info"></div>
            </div>
            <nav class="main-nav" id="main-nav"></nav>
        </header>

        <main>
            <section class="coffee-panel">
                <div class="coffee-toolbar">
                    <h2>Tipos de café por onzas</h2>
                    <div class="toolbar-actions">
                        <button class="btn-primary" type="button" onclick="registrarCantidades()">Guardar cantidades</button>
                        <button class="btn-secondary" type="button" onclick="limpiarCantidades()">Limpiar cantidades</button>
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="coffee-table">
                        <thead>
                            <tr>
                                <th>Onzas</th>
                                <th>Tipo de café</th>
                                <th>Cantidad</th>
                                <th>Registro</th>
                            </tr>
                        </thead>
                        <tbody id="coffee-table-body"></tbody>
                    </table>
                </div>
            </section>

            <section class="coffee-panel">
                <div class="coffee-toolbar">
                    <h2>Registro guardado</h2>
                    <div class="toolbar-actions">
                        <button class="btn-secondary" type="button" onclick="borrarRegistro()">Borrar registro</button>
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="registro-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Onzas</th>
                                <th>Tipo de café</th>
                                <th>Cantidad</th>
                            </tr>
                        </thead>
                        <tbody id="registro-table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/core/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/features/categories.js"></script>
    <script src="js/core/session-navigation.js"></script>
    <script src="js/core/init.js"></script>
    <script>
        const STORAGE_REGISTRO_CAFE = 'inventario_registro_cafe';

        const gruposCafe = [
            {
                onzas: '6oz',
                clase: 'group-6',
                cafes: [
                    'grano corto',
                    'grano doble',
                    'cortado'
                ]
            },
            {
                onzas: '9oz',
                clase: 'group-9',
                cafes: [
                    'americano',
                    'capuccino',
                    'cortado',
                    'latte',
                    'caramelo latte',
                    'creme brule latte',
                    'creme brulee capuccino',
                    'chocolate fuerte',
                    'chocolate con leche',
                    'mocaccino',
                    'caramelo capuccino',
                    'canela capuccino',
                    'chai latte',
                    'vainilla mocaccino',
                    'agua caliente'
                ]
            },
            {
                onzas: '14oz',
                clase: 'group-14',
                cafes: [
                    'americano',
                    'capuccino',
                    'cortado',
                    'caramelo capuccino',
                    'latte',
                    'caramelo latte',
                    'chocolate fuerte',
                    'chocolate con leche',
                    'mocaccino',
                    'creme brulee capuccino',
                    'creme brulee latte',
                    'vainilla capuccino',
                    'chai latte',
                    'canela capuccino',
                    'chocolate vainilla',
                    'canela mocaccino',
                    'vainilla latte',
                    'agua caliente'
                ]
            }
        ];

        function crearIdCafe(onzas, cafe) {
            return `${onzas}-${cafe}`.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
        }

        function obtenerRegistrosCafe() {
            return obtenerJsonStorage(STORAGE_REGISTRO_CAFE, []);
        }

        function guardarRegistrosCafe(registros) {
            guardarJsonStorage(STORAGE_REGISTRO_CAFE, registros);
        }

        function cantidadInput(id) {
            const input = document.getElementById(id);
            const cantidad = Number.parseInt(input.value, 10);
            return Number.isFinite(cantidad) && cantidad > 0 ? cantidad : 0;
        }

        function fijarCantidad(id, cantidad) {
            document.getElementById(id).value = Math.max(0, cantidad);
        }

        function cambiarCantidad(id, cambio) {
            fijarCantidad(id, cantidadInput(id) + cambio);
        }

        function normalizarCantidad(input) {
            const cantidad = Number.parseInt(input.value, 10);
            input.value = Number.isFinite(cantidad) && cantidad > 0 ? cantidad : 0;
        }

        function registrarCafe(onzas, cafe, inputId) {
            const cantidad = cantidadInput(inputId);
            if (cantidad <= 0) {
                alert('Ingresa una cantidad mayor a 0 para registrar.');
                return;
            }

            const registros = obtenerRegistrosCafe();
            registros.unshift({
                fecha: new Date().toLocaleString('es-CL'),
                onzas,
                cafe,
                cantidad
            });

            guardarRegistrosCafe(registros);
            fijarCantidad(inputId, 0);
            renderRegistroCafe();
        }

        function registrarCantidades() {
            const nuevosRegistros = [];

            gruposCafe.forEach(grupo => {
                grupo.cafes.forEach(cafe => {
                    const inputId = crearIdCafe(grupo.onzas, cafe);
                    const cantidad = cantidadInput(inputId);
                    if (cantidad > 0) {
                        nuevosRegistros.push({
                            fecha: new Date().toLocaleString('es-CL'),
                            onzas: grupo.onzas,
                            cafe,
                            cantidad
                        });
                        fijarCantidad(inputId, 0);
                    }
                });
            });

            if (nuevosRegistros.length === 0) {
                alert('No hay cantidades para guardar.');
                return;
            }

            guardarRegistrosCafe([...nuevosRegistros, ...obtenerRegistrosCafe()]);
            renderRegistroCafe();
        }

        function limpiarCantidades() {
            document.querySelectorAll('.qty-input').forEach(input => {
                input.value = 0;
            });
        }

        function borrarRegistro() {
            if (!confirm('¿Borrar todo el registro de café?')) return;
            guardarRegistrosCafe([]);
            renderRegistroCafe();
        }

        function renderTablaCafe() {
            const tbody = document.getElementById('coffee-table-body');
            tbody.innerHTML = gruposCafe.map(grupo => {
                return grupo.cafes.map((cafe, index) => {
                    const inputId = crearIdCafe(grupo.onzas, cafe);
                    const ounceCell = index === 0
                        ? `<td class="ounce-cell" rowspan="${grupo.cafes.length}">${grupo.onzas}</td>`
                        : '';
                    const startClass = index === 0 ? 'group-start' : '';

                    return `
                        <tr class="${grupo.clase} ${startClass}">
                            ${ounceCell}
                            <td class="coffee-name">${cafe}</td>
                            <td>
                                <div class="qty-control">
                                    <button class="qty-btn minus" type="button" onclick="cambiarCantidad('${inputId}', -1)" aria-label="Restar ${cafe} ${grupo.onzas}">-</button>
                                    <input class="qty-input" id="${inputId}" type="number" min="0" step="1" value="0" inputmode="numeric" onchange="normalizarCantidad(this)">
                                    <button class="qty-btn" type="button" onclick="cambiarCantidad('${inputId}', 1)" aria-label="Sumar ${cafe} ${grupo.onzas}">+</button>
                                </div>
                            </td>
                            <td>
                                <button class="row-register" type="button" onclick="registrarCafe('${grupo.onzas}', '${cafe}', '${inputId}')">Guardar</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }).join('');
        }

        function renderRegistroCafe() {
            const tbody = document.getElementById('registro-table-body');
            const registros = obtenerRegistrosCafe();

            if (registros.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td class="registro-empty" colspan="4">Sin registros guardados</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = registros.map(registro => `
                <tr>
                    <td>${registro.fecha}</td>
                    <td>${registro.onzas}</td>
                    <td class="coffee-name">${registro.cafe}</td>
                    <td><span class="registro-total">${registro.cantidad}</span></td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            inicializarDatos();
            renderTablaCafe();
            renderRegistroCafe();
        });
    </script>
</body>
</html>
